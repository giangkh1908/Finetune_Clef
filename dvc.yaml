# Một vòng lặp = một milestone:
#   fetch -> prepare -> check_data -> sanity -> train -> eval_val -> select -> register -> golden
# Bakeoff (chọn base model) NGOÀI vòng lặp: `dvc repro bakeoff/dvc.yaml`, quyết định ghi vào train.base_model.
# Golden chấm đúng 1 lần mỗi milestone (model đã chọn trên val), quyết định promote + ghi reports/next_action.md.
# Vòng sau: đổi params.yaml / schema/ (milestone.id mới + thay đổi) rồi `dvc repro` -> chỉ chạy lại stage bị ảnh hưởng.
#
#   dvc repro check_data      # CPU, chạy được trên laptop
#   dvc repro sanity          # GPU, vài phút: overfit 50 mẫu
#   dvc repro                 # cả vòng (GPU thuê)
#   dvc dag                   # xem lineage

stages:
  fetch:
    cmd: python -m src.fetch
    deps:
      - src/fetch.py
    params:
      - fetch
    outs:
      - raw/massive
      - raw/SOURCES.json

  prepare:
    cmd: python -m src.prepare
    deps:
      - src/prepare.py
      - src/common.py
      - raw/massive
    params:
      - fetch.locale
      - prepare
    outs:
      - data/train.jsonl
      - data/train_probe.jsonl
      - data/val.jsonl
      - data/golden/golden.jsonl
    metrics:
      - reports/data_stats.json:
          cache: false

  check_data:
    cmd: python -m src.check_data
    deps:
      - src/check_data.py
      - src/metrics.py
      - src/records.py
      - schema/massive_intent.yaml
      - data/train.jsonl
      - data/train_probe.jsonl
      - data/val.jsonl
      - data/golden/golden.jsonl
    params:
      - check
      - prepare.split
    metrics:
      - reports/checks.json:
          cache: false

  sanity:
    cmd: python -m src.sanity
    deps:
      - src/sanity.py
      - src/finetune.py
      - src/engines.py
      - src/records.py
      - src/metrics.py
      - schema/massive_intent.yaml
      - data/train.jsonl
      - reports/checks.json     # cổng chặn: chỉ chạy khi check_data đã pass
    params:
      - sanity
      - eval
      - train.base_model
      - train.base_revision
      - train.lora
    metrics:
      - reports/sanity.json:
          cache: false
    outs:
      - reports/sanity_wrong.jsonl:
          cache: false

  train:
    cmd: python -m src.train
    deps:
      - src/train.py
      - src/finetune.py
      - src/records.py
      - schema/massive_intent.yaml
      - schema/paraphrases.yaml
      - data/train.jsonl
      - reports/sanity.json     # cổng chặn: train chỉ chạy sau khi sanity đã pass
    params:
      - train
      - eval.max_length
    outs:
      - outputs/runs:
          cache: false
          persist: true     # giữ run đã xong để chạy tiếp được khi máy thuê bị ngắt
      - reports/train_runs.json:
          cache: false

  eval_val:
    cmd: python -m src.eval_val
    deps:
      - src/eval_val.py
      - src/engines.py
      - src/metrics.py
      - data/val.jsonl
      - data/train_probe.jsonl
      - reports/train_runs.json
    params:
      - eval
    outs:
      - outputs/preds:
          cache: false
          persist: true
      - reports/val_metrics.json:
          cache: false

  select:
    cmd: python -m src.select_model
    deps:
      - src/select_model.py
      - src/metrics.py
      - reports/val_metrics.json
    params:
      - select
      - gate
    outs:
      - reports/val_table.md:
          cache: false
      - reports/val_table.csv:
          cache: false
      - reports/threshold_curve.csv:
          cache: false
    metrics:
      - reports/selection.json:
          cache: false

  register:
    cmd: python -m src.register
    deps:
      - src/register.py
      - src/serving.py
      - schema
      - reports/selection.json
    params:
      - project
      - train.base_model
      - train.base_revision
    outs:
      - reports/registered.json:
          cache: false

  # Cuối mỗi vòng: chấm model vừa chọn trên golden đúng 1 lần, quyết định promote + gợi ý vòng sau.
  golden:
    cmd: python -m src.golden_eval
    deps:
      - src/golden_eval.py
      - src/metrics.py
      - reports/registered.json
      - data/golden/golden.jsonl
    params:
      - milestone
      - golden
      - gate
    outs:
      - reports/golden/${milestone.id}.json:
          cache: false
      - reports/next_action.md:
          cache: false

plots:
  - reports/threshold_curve.csv:
      x: threshold
      y: [precision, recall, f1, fpr]
      title: P / R / F1 / FPR theo ngưỡng confidence trên val (chọn ngưỡng F1 max)
